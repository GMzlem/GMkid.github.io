<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 회원가입 - 예슈아 사랑교회</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>예슈아 사랑교회</h1>
            <p>회원 로그인 | 회원가입</p>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">로그인</button>
            <button class="auth-tab" data-tab="signup">회원가입</button>
        </div>

        <!-- Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label for="loginEmail">이메일</label>
                <input 
                    type="email" 
                    id="loginEmail" 
                    required 
                    placeholder="example@email.com"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">비밀번호</label>
                <input 
                    type="password" 
                    id="loginPassword" 
                    required 
                    placeholder="••••••••"
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                로그인
            </button>

            <div class="auth-divider">
                <span>또는</span>
            </div>

            <button type="button" class="google-btn" id="googleLoginBtn">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Google로 로그인
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form">
            <div class="form-group">
                <label for="signupEmail">이메일</label>
                <input 
                    type="email" 
                    id="signupEmail" 
                    required 
                    placeholder="example@email.com"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="signupPassword">비밀번호</label>
                <input 
                    type="password" 
                    id="signupPassword" 
                    required 
                    placeholder="최소 6자 이상"
                    autocomplete="new-password"
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <label for="signupPasswordConfirm">비밀번호 확인</label>
                <input 
                    type="password" 
                    id="signupPasswordConfirm" 
                    required 
                    placeholder="비밀번호 재입력"
                    autocomplete="new-password"
                    minlength="6"
                >
            </div>

            <button type="submit" class="auth-btn" id="signupBtn">
                회원가입
            </button>

            <div class="auth-divider">
                <span>또는</span>
            </div>

            <button type="button" class="google-btn" id="googleSignupBtn">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Google로 계속하기
            </button>

            <div class="form-note">
                회원가입 후 로그인하여 교회의 회원 전용 콘텐츠를 이용하실 수 있습니다.
            </div>
        </form>

        <a href="index.html" class="back-link">← 메인 페이지로</a>
    </div>

    <script type="module">
        import { login, signup } from './js/auth.js';

        // DOM Elements
        const tabs = document.querySelectorAll('.auth-tab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Tab Switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                
                // Update active tab
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Show/hide forms
                if (targetTab === 'login') {
                    loginForm.classList.add('active');
                    signupForm.classList.remove('active');
                } else {
                    loginForm.classList.remove('active');
                    signupForm.classList.add('active');
                }
                
                // Clear messages
                hideMessages();
            });
        });

        // Login Form Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!email || !password) {
                showError('이메일과 비밀번호를 입력해주세요.');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = '로그인 중...';
            hideMessages();

            // Attempt login
            const result = await login(email, password);

            if (result.success) {
                showSuccess('로그인 성공! 메인 페이지로 이동합니다...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showError('로그인에 실패했습니다. 이메일과 비밀번호를 확인해주세요.');
                loginBtn.disabled = false;
                loginBtn.textContent = '로그인';
            }
        });

        // Signup Form Submit
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            const signupBtn = document.getElementById('signupBtn');

            // Validation
            if (!email || !password || !passwordConfirm) {
                showError('모든 필드를 입력해주세요.');
                return;
            }

            if (password !== passwordConfirm) {
                showError('비밀번호가 일치하지 않습니다.');
                return;
            }

            if (password.length < 6) {
                showError('비밀번호는 최소 6자 이상이어야 합니다.');
                return;
            }

            // Disable button
            signupBtn.disabled = true;
            signupBtn.textContent = '회원가입 중...';
            hideMessages();

            // Attempt signup
            const result = await signup(email, password);

            if (result.success) {
                showSuccess('회원가입 성공! 로그인 탭으로 이동합니다...');
                signupForm.reset();
                
                // Switch to login tab after 2 seconds
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('loginEmail').value = email;
                }, 2000);
                
                signupBtn.disabled = false;
                signupBtn.textContent = '회원가입';
            } else {
                showError(result.error);
                signupBtn.disabled = false;
                signupBtn.textContent = '회원가입';
            }
        });

        // Helper Functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Google Login Buttons
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const googleSignupBtn = document.getElementById('googleSignupBtn');

        async function handleGoogleLogin() {
            const { loginWithGoogle } = await import('./js/auth.js');
            
            hideMessages();
            
            // Disable buttons
            if (googleLoginBtn) googleLoginBtn.disabled = true;
            if (googleSignupBtn) googleSignupBtn.disabled = true;
            if (googleLoginBtn) googleLoginBtn.textContent = '로그인 중...';
            if (googleSignupBtn) googleSignupBtn.textContent = '로그인 중...';

            const result = await loginWithGoogle();

            if (result.success) {
                showSuccess('Google 로그인 성공! 메인 페이지로 이동합니다...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showError(result.error);
                
                // Re-enable buttons
                if (googleLoginBtn) {
                    googleLoginBtn.disabled = false;
                    googleLoginBtn.innerHTML = `
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            <path fill="none" d="M0 0h48v48H0z"/>
                        </svg>
                        Google로 로그인
                    `;
                }
                if (googleSignupBtn) {
                    googleSignupBtn.disabled = false;
                    googleSignupBtn.innerHTML = `
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            <path fill="none" d="M0 0h48v48H0z"/>
                        </svg>
                        Google로 계속하기
                    `;
                }
            }
        }

        if (googleLoginBtn) {
            googleLoginBtn.addEventListener('click', handleGoogleLogin);
        }

        if (googleSignupBtn) {
            googleSignupBtn.addEventListener('click', handleGoogleLogin);
        }
    </script>
</body>
</html>
