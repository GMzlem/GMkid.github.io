<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 예슈아 사랑교회</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Quill Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="loading" id="loading">로딩 중...</div>

    <div class="admin-container auth-guard" id="adminContent">
        <div class="admin-header">
            <h1>설교 관리</h1>
            <button class="logout-btn" id="logoutBtn">로그아웃</button>
        </div>

        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>

        <div class="form-card">
            <h2>새 설교 추가</h2>
            <form id="sermonForm">
                <div class="form-group">
                    <label for="service">예배 유형</label>
                    <select id="service" required>
                        <option value="">선택하세요</option>
                        <option value="sunday-morning">주일오전예배</option>
                        <option value="sunday-afternoon">주일오후예배</option>
                        <option value="wednesday">수요예배</option>
                        <option value="friday">금요예배</option>
                        <option value="sunday-school">주일학교</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">날짜</label>
                    <input 
                        type="date" 
                        id="date" 
                        required 
                    >
                </div>

                <div class="form-group">
                    <label for="title">제목</label>
                    <input 
                        type="text" 
                        id="title" 
                        required 
                        placeholder="주일오전예배 - 믿음으로 사는 삶"
                    >
                </div>

                <div class="form-group">
                    <label for="category">분류</label>
                    <select id="category">
                        <option value="">선택 안 함</option>
                        <optgroup label="구약">
                            <option value="창세기">창세기</option>
                            <option value="출애굽기">출애굽기</option>
                            <option value="레위기">레위기</option>
                            <option value="민수기">민수기</option>
                            <option value="신명기">신명기</option>
                            <option value="여호수아">여호수아</option>
                            <option value="사사기">사사기</option>
                            <option value="룻기">룻기</option>
                            <option value="사무엘상">사무엘상</option>
                            <option value="사무엘하">사무엘하</option>
                            <option value="열왕기상">열왕기상</option>
                            <option value="열왕기하">열왕기하</option>
                            <option value="역대상">역대상</option>
                            <option value="역대하">역대하</option>
                            <option value="에스라">에스라</option>
                            <option value="느헤미야">느헤미야</option>
                            <option value="에스더">에스더</option>
                            <option value="욥기">욥기</option>
                            <option value="시편">시편</option>
                            <option value="잠언">잠언</option>
                            <option value="전도서">전도서</option>
                            <option value="아가">아가</option>
                            <option value="이사야">이사야</option>
                            <option value="예레미야">예레미야</option>
                            <option value="예레미야애가">예레미야애가</option>
                            <option value="에스겔">에스겔</option>
                            <option value="다니엘">다니엘</option>
                            <option value="호세아">호세아</option>
                            <option value="요엘">요엘</option>
                            <option value="아모스">아모스</option>
                            <option value="오바댜">오바댜</option>
                            <option value="요나">요나</option>
                            <option value="미가">미가</option>
                            <option value="나훔">나훔</option>
                            <option value="하박국">하박국</option>
                            <option value="스바냐">스바냐</option>
                            <option value="학개">학개</option>
                            <option value="스가랴">스가랴</option>
                            <option value="말라기">말라기</option>
                        </optgroup>
                        <optgroup label="신약">
                            <option value="마태복음">마태복음</option>
                            <option value="마가복음">마가복음</option>
                            <option value="누가복음">누가복음</option>
                            <option value="요한복음">요한복음</option>
                            <option value="사도행전">사도행전</option>
                            <option value="로마서">로마서</option>
                            <option value="고린도전서">고린도전서</option>
                            <option value="고린도후서">고린도후서</option>
                            <option value="갈라디아서">갈라디아서</option>
                            <option value="에베소서">에베소서</option>
                            <option value="빌립보서">빌립보서</option>
                            <option value="골로새서">골로새서</option>
                            <option value="데살로니가전서">데살로니가전서</option>
                            <option value="데살로니가후서">데살로니가후서</option>
                            <option value="디모데전서">디모데전서</option>
                            <option value="디모데후서">디모데후서</option>
                            <option value="디도서">디도서</option>
                            <option value="빌레몬서">빌레몬서</option>
                            <option value="히브리서">히브리서</option>
                            <option value="야고보서">야고보서</option>
                            <option value="베드로전서">베드로전서</option>
                            <option value="베드로후서">베드로후서</option>
                            <option value="요한1서">요한1서</option>
                            <option value="요한2서">요한2서</option>
                            <option value="요한3서">요한3서</option>
                            <option value="유다서">유다서</option>
                            <option value="요한계시록">요한계시록</option>
                        </optgroup>
                    </select>
                </div>

                <div id="pagesContainer">
                    <div class="page-section" data-page="0">
                        <h3>페이지 1</h3>
                        <div class="editor-container">
                            <div id="editor-0" class="quill-editor"></div>
                        </div>
                    </div>
                </div>

                <div class="page-controls">
                    <button type="button" class="add-page-btn" id="addPageBtn">
                        + 페이지 추가
                    </button>
                </div>

                <div class="draft-controls" aria-label="임시저장">
                    <button type="button" class="draft-btn draft-save-btn" id="saveDraftBtn">
                        임시저장
                    </button>
                    <button type="button" class="draft-btn draft-load-btn" id="loadDraftBtn">
                        임시저장 불러오기
                    </button>
                    <button type="button" class="draft-btn draft-delete-btn" id="deleteDraftBtn">
                        임시저장 삭제
                    </button>
                </div>
                <p class="draft-status" id="draftStatus" aria-live="polite"></p>

                <button type="submit" class="submit-btn" id="submitBtn">
                    설교 추가
                </button>
            </form>

            <a href="sermon.html" class="back-link">설교 페이지로 돌아가기</a>
        </div>
    </div>

    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="js/sanitize-html.js"></script>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { onAuthChange, logout } from './js/auth.js';
        import { 
            collection, 
            addDoc,
            doc,
            getDoc,
            setDoc,
            deleteDoc,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js';

        const loading = document.getElementById('loading');
        const adminContent = document.getElementById('adminContent');
        const sermonForm = document.getElementById('sermonForm');
        const pagesContainer = document.getElementById('pagesContainer');
        const addPageBtn = document.getElementById('addPageBtn');
        const saveDraftBtn = document.getElementById('saveDraftBtn');
        const loadDraftBtn = document.getElementById('loadDraftBtn');
        const deleteDraftBtn = document.getElementById('deleteDraftBtn');
        const draftStatus = document.getElementById('draftStatus');
        const submitBtn = document.getElementById('submitBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        let pageCount = 1;
        let editors = {};
        let currentUser = null;
        const sanitizeSermonHtml = window.SermonSanitizer?.sanitizeSermonHtml || ((value) => String(value || ''));

        // Quill toolbar options
        const toolbarOptions = [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'indent': '-1'}, { 'indent': '+1' }],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'align': [] }],
            ['blockquote', 'code-block'],
            ['link'],
            ['clean']
        ];

        // Initialize first editor
        function initializeEditor(id, placeholder = '설교 내용을 입력하세요...\n\n예시:\n제목을 입력하고 [H1] 버튼으로 크게 만들 수 있어요.\n중요한 부분은 [B] 버튼으로 굵게 표시하세요.') {
            const editor = new Quill(`#${id}`, {
                theme: 'snow',
                placeholder: placeholder,
                modules: {
                    toolbar: toolbarOptions
                }
            });
            editors[id] = editor;
            return editor;
        }

        // Initialize first editor on load
        initializeEditor('editor-0');

        // Check auth state
        onAuthChange((user, isAdmin) => {
            loading.style.display = 'none';
            
            if (!user || !isAdmin) {
                currentUser = null;
                alert('관리자 권한이 필요합니다.');
                window.location.href = 'login.html?redirect=admin.html';
            } else {
                currentUser = user;
                adminContent.classList.add('active');
                checkDraftOnLoad();
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            const result = await logout();
            if (result.success) {
                window.location.href = 'sermon.html';
            }
        });

        // Add page
        addPageBtn.addEventListener('click', () => {
            addEditorPage();
        });

        function addEditorPage(content = '') {
            const editorId = `editor-${pageCount}`;
            const pageSection = document.createElement('div');
            pageSection.className = 'page-section';
            pageSection.setAttribute('data-page', pageCount);
            pageSection.innerHTML = `
                <h3>페이지 ${pageCount + 1}</h3>
                <div class="editor-container">
                    <div id="${editorId}" class="quill-editor"></div>
                </div>
                <div class="page-controls">
                    <button type="button" class="remove-page-btn">
                        × 페이지 삭제
                    </button>
                </div>
            `;
            pageSection.querySelector('.remove-page-btn').addEventListener('click', () => {
                pageSection.remove();
                updatePageHeadings();
            });
            pagesContainer.appendChild(pageSection);

            const editor = initializeEditor(editorId, '계속해서 내용을 입력하세요...');
            if (content) {
                editor.root.innerHTML = sanitizeSermonHtml(content);
            }

            pageCount++;
        }

        function updatePageHeadings() {
            pagesContainer.querySelectorAll('.page-section').forEach((section, index) => {
                const heading = section.querySelector('h3');
                if (heading) {
                    heading.textContent = `페이지 ${index + 1}`;
                }
            });
        }

        function hasTextContent(html) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            return tempDiv.textContent.trim().length > 0;
        }

        function getEditorContents({ includeEmpty = false } = {}) {
            const pageContents = [];
            const pageSections = document.querySelectorAll('.page-section');

            pageSections.forEach((section) => {
                const editorId = `editor-${section.getAttribute('data-page')}`;
                const editor = editors[editorId];

                if (editor) {
                    const html = sanitizeSermonHtml(editor.root.innerHTML);
                    if (includeEmpty || hasTextContent(html)) {
                        pageContents.push(html);
                    }
                }
            });

            return pageContents;
        }

        function toFirestoreDate(value) {
            return value.replaceAll('-', '.');
        }

        function toDateInputValue(value) {
            return value ? value.replaceAll('.', '-') : '';
        }

        function getDraftRef() {
            if (!currentUser) {
                throw new Error('관리자 로그인 정보가 없습니다.');
            }
            return doc(db, 'sermonDrafts', currentUser.uid);
        }

        function buildDraftPayload() {
            return {
                service: document.getElementById('service').value,
                date: toFirestoreDate(document.getElementById('date').value),
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                content: getEditorContents({ includeEmpty: true }),
                updatedAt: serverTimestamp()
            };
        }

        function restoreDraft(data) {
            document.getElementById('service').value = data.service || 'sunday-morning';
            document.getElementById('date').value = toDateInputValue(data.date || '');
            document.getElementById('title').value = data.title || '';
            document.getElementById('category').value = data.category || 'main';
            resetEditors(Array.isArray(data.content) && data.content.length > 0 ? data.content : ['']);
            setDraftStatus('임시저장을 불러왔습니다.');
        }

        function resetEditors(contents = ['']) {
            pagesContainer.innerHTML = `
                <div class="page-section" data-page="0">
                    <h3>페이지 1</h3>
                    <div class="editor-container">
                        <div id="editor-0" class="quill-editor"></div>
                    </div>
                </div>
            `;
            pageCount = 1;
            editors = {};

            const firstEditor = initializeEditor('editor-0');
            if (contents[0]) {
                firstEditor.root.innerHTML = sanitizeSermonHtml(contents[0]);
            }

            contents.slice(1).forEach((content) => addEditorPage(content));
            updatePageHeadings();
        }

        function setDraftStatus(message) {
            draftStatus.textContent = message;
        }

        async function saveDraft() {
            hideMessages();
            saveDraftBtn.disabled = true;
            saveDraftBtn.textContent = '저장 중...';

            try {
                await setDoc(getDraftRef(), buildDraftPayload(), { merge: true });
                setDraftStatus('임시저장되었습니다.');
            } catch (error) {
                console.error('Error saving draft:', error);
                showError('임시저장 중 오류가 발생했습니다: ' + error.message);
            } finally {
                saveDraftBtn.disabled = false;
                saveDraftBtn.textContent = '임시저장';
            }
        }

        async function loadDraft({ askIfExists = false } = {}) {
            hideMessages();
            loadDraftBtn.disabled = true;

            try {
                const snapshot = await getDoc(getDraftRef());
                if (!snapshot.exists()) {
                    setDraftStatus('저장된 임시저장이 없습니다.');
                    return;
                }

                if (askIfExists && !confirm('작성 중인 임시저장이 있습니다. 불러올까요?')) {
                    setDraftStatus('저장된 임시저장이 있습니다.');
                    return;
                }

                restoreDraft(snapshot.data());
            } catch (error) {
                console.error('Error loading draft:', error);
                showError('임시저장 불러오기 중 오류가 발생했습니다: ' + error.message);
            } finally {
                loadDraftBtn.disabled = false;
            }
        }

        async function deleteDraft({ silent = false } = {}) {
            if (!silent && !confirm('임시저장을 삭제할까요?')) {
                return;
            }

            deleteDraftBtn.disabled = true;

            try {
                await deleteDoc(getDraftRef());
                if (!silent) {
                    setDraftStatus('임시저장이 삭제되었습니다.');
                }
            } catch (error) {
                if (!silent) {
                    console.error('Error deleting draft:', error);
                    showError('임시저장 삭제 중 오류가 발생했습니다: ' + error.message);
                } else {
                    console.warn('Draft cleanup failed:', error);
                }
            } finally {
                deleteDraftBtn.disabled = false;
            }
        }

        function checkDraftOnLoad() {
            loadDraft({ askIfExists: true });
        }

        saveDraftBtn.addEventListener('click', saveDraft);
        loadDraftBtn.addEventListener('click', () => loadDraft());
        deleteDraftBtn.addEventListener('click', () => deleteDraft());

        // Submit form
        sermonForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const service = document.getElementById('service').value;
            const date = toFirestoreDate(document.getElementById('date').value);
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const pageContents = getEditorContents();

            if (pageContents.length === 0) {
                showError('최소 하나의 페이지 내용을 입력해주세요.');
                return;
            }

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = '추가 중...';
            hideMessages();

            try {
                // Add to Firestore
                await addDoc(collection(db, 'sermons'), {
                    service: service,
                    date: date,
                    title: title,
                    category: category,
                    content: pageContents,
                    timestamp: serverTimestamp()
                });

                showSuccess('설교가 성공적으로 추가되었습니다!');
                await deleteDraft({ silent: true });
                
                // Reset form
                sermonForm.reset();
                resetEditors();
                setDraftStatus('');

            } catch (error) {
                console.error('Error adding sermon:', error);
                showError('설교 추가 중 오류가 발생했습니다: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '설교 추가';
            }
        });

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideMessages() {
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            successMessage.textContent = '';
            errorMessage.textContent = '';
        }
    </script>
</body>
</html>
