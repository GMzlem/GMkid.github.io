# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  schedule:
    # 00:00 Asia/Seoul
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  checks: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SEO sermon pages
        run: node generate-sermons.js
      - name: Commit generated sermon pages
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain sermons sitemap.xml)" ]; then
            git add sermons sitemap.xml
            git commit -m "chore: update generated sermon pages [skip ci]"
            git push
          else
            echo "No generated sermon changes to commit."
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YESHUA_LOVE }}
          channelId: live
          projectId: yeshua-love
